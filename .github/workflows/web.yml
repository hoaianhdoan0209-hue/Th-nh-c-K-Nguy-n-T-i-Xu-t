name: Build browser playable (Web)

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game9-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install export templates in Actions home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          test -d /root/.local/share/godot/export_templates/4.3.stable
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip"
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable"/web_nothreads_*.zip
      - name: Import Godot assets
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee web-import.log
      - name: Export mobile browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee web-export.log
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -name '*.pck' -print -quit)"
          ! grep -E 'SCRIPT ERROR|Parse Error|(^|[[:space:]])ERROR:' web-import.log web-export.log
          ls -lh build/web
      - name: Store browser-playable files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game9-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 30
      - name: Upload export logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game9-web-export-logs
          path: |
            web-import.log
            web-export.log
          if-no-files-found: ignore


  check-pages:
    name: Check whether GitHub Pages is enabled
    needs: web-export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - name: Inspect Pages configuration
        id: status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
              core.info('GitHub Pages is enabled.');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.notice('GitHub Pages is disabled. Enable it once at Settings > Pages > Build and deployment > Source: GitHub Actions.');
              } else {
                throw error;
              }
            }

  deploy-pages:
    name: Publish browser build to GitHub Pages
    needs: [web-export, check-pages]
    if: github.ref == 'refs/heads/main' && needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve verified Web export
        uses: actions/download-artifact@v4
        with:
          name: game9-web-build
          path: build/web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
